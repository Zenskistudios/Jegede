services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jegede
      POSTGRES_PASSWORD: jegede
      POSTGRES_DB: jegede
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jegede"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://jegede:jegede@db:5432/jegede
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
