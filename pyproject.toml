[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jegede"
version = "0.1.0"
description = "Backend for Yoruba-language apps."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.100",
  "psycopg[binary]>=3.1",
  "uvicorn[standard]>=0.23",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "psycopg[binary]>=3.1", "uvicorn[standard]>=0.23"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
